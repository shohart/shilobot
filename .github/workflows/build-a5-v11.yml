# Temporary build runner for A5-V11
name: Build A5-V11 PrintServer

on:
  workflow_dispatch:
  push:
    branches:
      - 'a5-v11-build-*'
    paths:
      - 'build.sh'
      - '.github/workflows/build-a5-v11.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libncurses5-dev zlib1g-dev gawk gettext \
            xsltproc rsync wget curl xz-utils ca-certificates python3
      - name: Build firmware
        run: |
          chmod +x build.sh
          # OpenWrt 18.06 ImageBuilder's prerequisite checker only recognizes
          # GCC through version 10 and requires Python 2. The ImageBuilder is
          # precompiled, so mark that legacy host check as satisfied after it
          # is unpacked and before the image target runs.
          sed -i '/^make image /i mkdir -p staging_dir/host \&\& touch staging_dir/host/.prereq-build' build.sh
          grep -n -B1 -A2 '^make image' build.sh
          ./build.sh
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: a5-v11-printserver-firmware
          path: |
            out/*.bin
            out/*.sha256
            out/SHA256SUMS
            out/build-info.txt
          if-no-files-found: error
